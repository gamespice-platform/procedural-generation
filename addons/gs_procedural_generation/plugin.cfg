[plugin]

name="gs-procedural-generation"
description="Procedural generation as a deterministic pipeline over a document: rooms, caves, mazes, heightmaps, scatter and connection steps, a validator that floods the result and refuses an unreachable one, retries on a new seed, frame-budgeted runtime generation, and a pipeline hash so two peers can prove they generated the same world. Depends only on gs-core."
author="dot"
version="0.1.0"
script="gs_procedural_generation_plugin.gd"
